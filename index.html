:root {
  --blue: #2E45B8;
  --navy: #1F2E7A;
  --ink: #0E0C0C;
  --map-gray: #B3B3B3;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  font-family: 'Noto Sans', Arial, sans-serif;
  color: var(--ink);
}

/* Stage container occupying the 100% viewport matching M1 standard */
.cover-viewport {
  position: relative;
