<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The lead-up to the US-China rivalry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root{
  --red:#E3120B; --navy:#1F2E7A; --navy-deep:#141F52;
  --blue:#2E45B8; --teal:#36E2BD; --cream:#EBE9E0;
  --ink:#0f172a; --muted:#5a5f73; --rule:#d7d9e0;
  --maxw:1320px;
  --screen-height:580px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans',Arial,sans-serif;background:#fff;
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:2px;}

/* ── Screen switching ──
   Screens size to their real content (not a fixed 100vh) so the iframe can
   be resized to match exactly — no leftover white space, no internal
   scrollbar. See the height-reporting script near the end of the file. */
html,body{overflow-x:hidden;;overflow-y:hidden;}
.screen{display:none;}
/* height:100vh + overflow:hidden creates the stacking context for sticky */
.screen.is-active{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── APPBAR ── */
.appbar{
  position:relative;z-index:40;flex:none;
  background:#fff;border-bottom:1px solid var(--rule);
  height:60px;
  display:flex;align-items:stretch;
}
/* Inner wrapper keeps logo+title+tools within the content max-width,
   with padding matching .work-inner so content aligns perfectly */
.appbar-inner{
  width:100%;max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:stretch;
  padding:0 clamp(18px,4vw,52px);
}
.appbar-logo{flex:none;display:flex;align-items:stretch;margin-left:-clamp(18px,4vw,52px);}
.appbar-logo svg{height:100%;width:auto;display:block;}
.appbar-divider{width:1px;background:var(--rule);margin:12px 0;flex:none;}
.appbar-title{flex:1;display:flex;align-items:center;
  padding:0 16px;font-size:14px;font-weight:500;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar-tools{display:flex;align-items:center;gap:8px;flex:none;}
/* Icon buttons: proper circle with correct SVG sizing */
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--blue);display:grid;place-items:center;
  color:var(--blue);background:#fff;cursor:pointer;
  transition:background .15s,color .15s;flex:none;
}
.icon-btn:hover,.icon-btn:focus-visible{background:var(--blue);color:#fff;}
.icon-btn svg{
  width:16px;height:16px;
  fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  overflow:visible;display:block;
}

/* ── COVER ── */
#cover{overflow:hidden;}
.cover-stage{
  position:relative;width:100%;max-width:var(--maxw);margin:0 auto;
  display:grid; /* text and art share one grid cell; the cell's height is
    set automatically by its tallest item (the art), which sizes itself
    from its own width via aspect-ratio — no guessed buffer needed at any
    container width, unlike a fixed aspect-ratio on the stage itself. */
  padding:clamp(16px,3vw,40px) clamp(18px,4vw,52px);
  overflow:hidden;
}
.cover-text{
  grid-area:1/1;align-self:center;justify-self:start;
  position:relative;z-index:5;max-width:clamp(300px,42%,560px);
}
.cover-title{font-size:clamp(34px,4.2vw,56px);font-weight:800;
  line-height:1.08;letter-spacing:-.02em;color:var(--ink);
  margin-bottom:clamp(16px,2.4vw,32px);}
.btn-start{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--blue);color:#fff;font-weight:700;font-size:15px;
  min-width:clamp(120px,14vw,152px);height:44px;padding:0 24px;
  border-radius:4px;cursor:pointer;transition:background .18s;}
.btn-start:hover,.btn-start:focus-visible{background:var(--navy);}

/* Cover art now shares the .cover-stage grid cell with .cover-text (see
   above) instead of being absolutely inset — it's what determines the
   stage's height, at exactly the size its own width/aspect-ratio needs. */
.cover-art{
  grid-area:1/1;align-self:center;justify-self:stretch;
  width:100%;aspect-ratio:1340/530;
  pointer-events:none;z-index:1;
;}
.cover-art-inner{
  position:relative;width:100%;aspect-ratio:1340/530;
}
/* Mobile cover art (stacked layout) — hidden on desktop */
.cover-art-mobile{display:none;}
.cover-path{width:100%;height:100%;display:block;overflow:visible;}
.cover-path .road{fill:none;stroke:var(--blue);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.cover-path .arrowhead{fill:none;stroke:var(--blue);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;}
.cover-path .node{fill:var(--navy);transform-origin:center;transform-box:fill-box;}

/* Cover floating thumbnails */
.thumb{
  position:absolute;
  width:clamp(54px,9%,76px);height:clamp(54px,9%,76px);
  transform:translate(-50%,-50%) scale(.6);opacity:0;
  transition:opacity .4s ease,transform .4s cubic-bezier(.16,1,.3,1);
  pointer-events:none;z-index:10;
}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:contain;display:block;}
.thumb.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* Slow down cover animation to match intro slide */
.cover-art svg circle,
.cover-art svg ellipse,
.cover-art svg g {
  animation: dotPulse 3s ease-in-out infinite !important;
}

@keyframes floaty{
  0%,100%{transform:translate(-50%,-50%) translateY(0);}
  50%{transform:translate(-50%,-50%) translateY(-7px);}
}
.thumb.show{animation:floaty 5s ease-in-out infinite;}

/* ── INTRO & EVENT: shared scrollable content area ── */
/* Fills all space between appbar and tl-wrap. Content scrolls if needed. */
.work-outer{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
.work-inner{
  max-width:var(--maxw);
  width:100%;
  margin:0 auto;
  padding:clamp(8px,2vw,20px) clamp(18px,4vw,52px) clamp(16px,2vw,24px);
  display:flex;
  flex-direction:column;
}
.tl-inner{
  max-width:var(--maxw);
  margin:0 auto;
  padding:clamp(8px,2vw,20px) clamp(18px,4vw,52px) 0;
  display:flex;
  flex-direction:column;
  min-height:100%;
}
/* Intro needs a touch more headroom so the S-curve clears the appbar */
#intro .work-inner{padding-top:clamp(16px,3vw,32px);}

/* ── INTRO: S-curve panel ──
   Grid-stacked (like the cover) so intro-body's height is set by the art's
   own aspect-ratio-driven size — it no longer relies on a bounded parent
   height, which is what let the art spill past the bottom and overlap the
   timeline below it. */
.intro-body{
  position:relative;display:grid;
  /* Never taller than the space between appbar and timeline bar */
  max-height:calc(100vh - 60px - 80px - clamp(16px,3vw,32px));
  flex:1;
}
.intro-copy{
  grid-area:1/1;align-self:center;justify-self:start;
  position:relative;z-index:2;max-width:clamp(280px,44%,520px);
}
.intro-copy p{
  font-size:clamp(15px,1.4vw,18px);line-height:1.68;
  color:var(--ink);font-weight:400;margin-bottom:16px;
}
.intro-copy p:last-child{margin-bottom:0;}
.intro-bg{
  grid-area:1/1;align-self:center;justify-self:stretch;
  position:relative;width:100%;aspect-ratio:1200/465;
  max-height:100%;z-index:0;pointer-events:none;overflow:hidden;
}
.intro-bg svg{width:100%;height:100%;display:block;overflow:visible;}
.intro-path .road{fill:none;stroke:var(--blue);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.intro-path .arrowhead{fill:none;stroke:var(--blue);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
.intro-path .ndot{fill:var(--navy);transform-origin:center;transform-box:fill-box;}
.intro-path .ndot.faint{fill:#9aa3c7;}

/* ── EVENT columns ── */
.work-body{
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);
  gap:clamp(20px,4vw,56px);
  align-items:start;     /* pin both columns to the same top edge, so text
    position doesn't drift between events with different description
    lengths or illustration heights */
  width:100%;
  padding:clamp(12px,2vw,24px) 0;
}
.ev-text{display:flex;flex-direction:column;}
.ev-head{display:flex;align-items:baseline;gap:clamp(10px,1.2vw,16px);flex-wrap:wrap;margin-bottom:4px;}
.ev-year{font-size:clamp(36px,4.2vw,54px);font-weight:800;
  color:var(--red);letter-spacing:-.02em;line-height:1;flex:none;}
.ev-title{font-size:clamp(16px,1.8vw,22px);font-weight:800;
  letter-spacing:-.015em;line-height:1.22;color:var(--ink);}
.ev-rule{height:1px;background:var(--rule);margin:14px 0 16px;}
.ev-desc{font-size:clamp(13px,1.2vw,15px);line-height:1.72;color:var(--ink);}

.ev-illo{display:flex;justify-content:center;align-items:flex-start;padding-top:clamp(4px,1vw,12px);}
.ev-illo-inner{
  width:100%;max-width:360px;
  aspect-ratio:1/1;display:grid;place-items:center;
;min-height:260px;max-height:280px;}
.ev-illo-inner svg,.ev-illo-inner img{width:100%;height:100%;display:block;object-fit:contain;}

/* ── TIMELINE STRIP ── */
/* Timeline sits at the bottom of the screen as a flex child (margin-top:auto
   pushes it down). A max-width wrapper aligns it with the content columns.  */
/* Direct flex child of .screen — sits permanently between
   work-outer and the screen bottom, never moves with content. */
.tl-wrap{
  flex:none;
  width:100%;
  background:#fff;
  padding:12px 0 14px;
  overflow:visible;
}
.tl-inner-wrap{
  max-width:var(--maxw);
  margin:0 auto;
  padding:0 clamp(18px,4vw,52px);
}
.tl-scroll{
  overflow-x:hidden; /* track fills 100% width, no horizontal scroll needed */
  overflow-y:visible;
  width:100%;
}
.tl-scroll::-webkit-scrollbar{display:none;}
/* align-items:flex-start + margin-top on connector centres line on the button */
.tl-track{
  display:flex;align-items:flex-start;
  /* width:100% + no min-width: nodes spread to fill the content width */
  width:100%;
  padding:4px 2px 6px;
}
.tl-conn{
  flex:1;
  height:2px;background:rgba(31,46,122,.25);
  /* Centre on 40px button: (40/2)-(2/2) = 19px */
  margin-top:19px;
}
.tl-node{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;}
.tl-btn{
  width:40px;height:40px;
  border-radius:50%;border:1.5px solid var(--blue);background:#fff;
  color:var(--blue);font-weight:700;font-size:13px;
  flex-shrink:0;display:grid;place-items:center;cursor:pointer;
  transition:background .2s,color .2s,box-shadow .2s,transform .18s;
}
.tl-btn:hover{background:var(--blue);color:#fff;transform:translateY(-2px);}
.tl-btn.visited{background:#eef0fb;color:var(--navy);}
.tl-btn.active{
  background:var(--navy-deep)!important;color:#fff!important;
  border-color:var(--navy-deep);
  /* Teal ring without scale — scale causes layout shift when clicking */
  box-shadow:0 0 0 3.5px var(--teal),0 2px 8px rgba(20,31,82,.2);
  transform:none;
}
.tl-year{font-size:11px;font-weight:700;color:var(--ink);margin-top:3px;white-space:nowrap;}
.tl-label{display:none;}
.tl-node-text{display:flex;flex-direction:column;align-items:center;}

/* Fade transition for event content swap */
.fade{transition:opacity .2s ease;}

/* ── MOBILE-ONLY ELEMENTS (hidden on desktop) ── */
.screen-title{display:none;}
.acc{display:none;}

/* ── BIB MODAL ── */
.bib-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(15,23,42,.65);backdrop-filter:blur(3px);
  z-index:200;align-items:center;justify-content:center;padding:20px;
}
.bib-overlay.open{display:flex;}
.bib-box{
  background:#fff;border-radius:10px;max-width:720px;width:100%;
  max-height:82vh;display:flex;flex-direction:column;
  box-shadow:0 16px 52px rgba(0,0,0,.24);
}
.bib-head{
  padding:18px 24px 14px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;flex:none;
}
.bib-head h2{font-size:18px;font-weight:700;}
.bib-close{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--navy);
  display:grid;place-items:center;color:var(--navy);background:#fff;
  font-size:22px;cursor:pointer;line-height:1;
  transition:background .15s,color .15s;
}
.bib-close:hover{background:var(--navy);color:#fff;}
.bib-body{padding:18px 24px;overflow-y:auto;font-size:13.5px;line-height:1.72;color:var(--muted);}
.bib-entry{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--rule);}
.bib-entry:last-child{border:none;margin:0;padding:0;}

/* Dynamic smooth height transitions to prevent visual jumping during iframe updates */
iframe.iframe-interactive {
  transition: height 0.3s ease-in-out;
}

/* ── MOBILE ≤560px ──
   Lowered from 700px so a laptop with a Moodle side menu open (which can
   shrink the iframe below the old 700px threshold) stays in the laptop
   layout — reserved now for genuinely small/phone screens. */
@media(max-width:560px){
  html,body{overflow:auto;height:auto;}
  .screen{overflow:visible;}
  #cover{overflow:visible;}   /* beat the desktop #cover{overflow:hidden} ID rule */
  .work-outer{overflow:visible;flex:none;}
  .work-inner{padding:0 20px 0;}
  #intro .work-inner{padding-top:0;}

  /* ── Appbar: logo on row 1, tool icons on a full-width row below ── */
  .appbar{height:auto;}
  .appbar-inner{padding:0 20px;flex-wrap:wrap;align-items:center;}
  .appbar-logo{margin-left:-20px;flex:0 0 auto;}
  .appbar-divider{display:none;}
  .appbar-title{display:none;}              /* title moves into body as H1 */
  .appbar-tools{flex:1 1 100%;justify-content:space-between;padding:12px 0 14px;gap:0;}
  .icon-btn{width:46px;height:46px;}
  .icon-btn svg{width:20px;height:20px;}

  /* Body H1 (replaces the appbar title on mobile) */
  .screen-title{
    display:block;font-size:clamp(22px,6.4vw,27px);font-weight:800;
    letter-spacing:-.01em;line-height:1.18;color:var(--ink);
    margin:18px 0 14px;
  }

  /* ── Cover: stacked title → art → button ── */
  .cover-art{display:none;}                 /* hide desktop absolute art */
  .cover-stage{
    display:flex;flex-direction:column;align-items:stretch;
    padding:22px 20px 28px;min-height:auto;flex:none;
  }
  .cover-text{max-width:none;display:flex;flex-direction:column;align-self:stretch;}
  .cover-title{font-size:clamp(28px,8vw,40px);margin-bottom:8px;order:1;}
  .cover-art-mobile{display:block;width:100%;max-width:340px;
    margin:6px auto 22px;order:2;position:relative;}
  .cover-art-mobile .cover-path{width:100%;height:auto;display:block;overflow:visible;}
  .cover-art-mobile .thumb{
    width:clamp(34px,15%,50px);height:clamp(34px,15%,50px);
    opacity:1;transform:translate(-50%,-50%) scale(1);
  }
  .btn-start{width:100%;max-width:none;height:52px;font-size:16px;order:3;}
  /* faint rule under the button, as in the mockup */
  .cover-text::after{content:'';display:block;height:1px;
    background:var(--rule);margin-top:30px;order:4;}

  /* ── Intro = single scrolling page: title, copy, accordion ── */
  .intro-body{padding:8px 0;display:block;}
  .intro-bg{display:none;}
  .intro-copy{max-width:none;}
  .intro-copy p{font-size:15px;line-height:1.6;margin-bottom:14px;}

  /* Hide the horizontal timeline strip; the accordion replaces it */
  .tl-wrap{display:none;}

  /* ── Event screen: stack as a single column (illustration on top, then
     year/title/description) to mirror the accordion's expanded view. Mobile
     primarily uses the accordion, but this keeps the event screen clean if
     it is ever reached (e.g. navigating on desktop, then narrowing). ── */
  .work-body{display:flex;flex-direction:column;margin:0;padding:6px 0 24px;}
  .ev-illo{order:-1;justify-content:flex-start;align-items:flex-start;
    padding:0;margin:4px auto 16px;width:100%;max-width:260px;}
  .ev-illo-inner{max-width:260px;}
  .ev-head{margin-bottom:6px;}
  .ev-year{font-size:26px;}
  .ev-title{font-size:18px;}
  .ev-rule{margin:10px 0 12px;}
  .ev-desc{font-size:14px;line-height:1.7;}

  /* ── Accordion timeline ── */
  .acc{display:block;margin-top:6px;padding-bottom:28px;}
  .acc-item{position:relative;}
  .acc-row{
    width:100%;display:flex;align-items:flex-start;gap:14px;
    padding:12px 0;text-align:left;background:none;border:none;
    cursor:pointer;position:relative;
  }
  /* connector line running behind the circles */
  .acc-row::before{
    content:'';position:absolute;left:19px;top:0;bottom:0;width:2px;
    background:rgba(31,46,122,.25);z-index:0;
  }
  .acc-item:first-child .acc-row::before{top:32px;}
  .acc-item:last-child  .acc-row::before{bottom:calc(100% - 32px);}
  .acc-numwrap{position:relative;flex:none;width:40px;display:flex;justify-content:center;}
  .acc-num{
    width:40px;height:40px;border-radius:50%;border:1.5px solid var(--blue);
    background:#fff;color:var(--blue);font-weight:700;font-size:14px;
    display:grid;place-items:center;position:relative;z-index:1;
  }
  .acc-meta{display:flex;flex-direction:column;padding-top:6px;gap:3px;}
  .acc-year{font-size:15px;font-weight:700;color:var(--ink);}
  .acc-title{font-size:14px;font-weight:400;color:var(--muted);line-height:1.35;}

  /* expanded panel */
  .acc-panel{display:none;padding:8px 0 20px;}
  .acc-item.open .acc-row{display:none;}
  .acc-item.open .acc-panel{display:block;}
  .acc-illo{
    position:relative;width:100%;max-width:260px;margin:4px auto 16px;
    aspect-ratio:1/1;
  }
  .acc-illo-inner{width:100%;height:100%;display:grid;place-items:center;}
  .acc-illo-inner svg,.acc-illo-inner img{width:100%;height:100%;object-fit:contain;display:block;}
  .acc-badge{
    position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;
    background:var(--navy-deep);color:#fff;font-weight:700;font-size:14px;
    display:grid;place-items:center;z-index:2;
    box-shadow:0 0 0 3px var(--teal);
  }
  .acc-year-lg{font-size:26px;font-weight:800;color:var(--red);line-height:1;margin-bottom:6px;}
  .acc-title-lg{font-size:18px;font-weight:800;color:var(--ink);line-height:1.25;margin-bottom:12px;}
  .acc-desc{font-size:14px;line-height:1.7;color:var(--ink);}
}

@media(max-width:400px){
  .cover-title{font-size:28px;}
  .btn-start{max-width:none;}
}

@media(prefers-reduced-motion:reduce){
  .thumb{transition:none!important;animation:none!important;}
  .fade{transition:none!important;}
  *{animation-duration:.001ms!important;}
}
</style>

<script>
(function() {
  var config = {
    heightBuffer: 20,
    debounceDelay: 100,
    minHeight: 400,
    maxHeight: 5000,
    debug: false
  };

  var resizeTimers = {};
  var initialResizeDone = {};

  function resizeIframe(iframe, newHeight) {
    var numHeight = parseInt(newHeight, 10) + config.heightBuffer;
    if (numHeight < config.minHeight) numHeight = config.minHeight;
    if (numHeight > config.maxHeight) numHeight = config.maxHeight;
    var heightPx = numHeight + 'px';

    if (iframe.style.height !== heightPx) {
      if (config.debug) console.log('Resizing interactive iframe:', iframe.id || iframe.src, 'to', heightPx);
      requestAnimationFrame(function() { iframe.style.height = heightPx; });
    }
  }

  function debouncedResize(iframe, height) {
    var iframeId = iframe.id || iframe.src;

    if (!initialResizeDone[iframeId]) {
      initialResizeDone[iframeId] = true;
      resizeIframe(iframe, height);
      return;
    }

    clearTimeout(resizeTimers[iframeId]);
    resizeTimers[iframeId] = setTimeout(function() { resizeIframe(iframe, height); }, config.debounceDelay);
  }

  window.addEventListener('message', function(e) {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type !== 'resize') return;
    if (e.data.app !== 'ce-interactive') return; // ignore polls / other embeds sharing type:'resize'
    if (typeof e.data.height !== 'number') return;

    if (config.debug) console.log('Interactive resize message:', e.data);

    var iframes = document.querySelectorAll('iframe.iframe-interactive');
    for (var i = 0; i < iframes.length; i++) {
      if (iframes[i].contentWindow === e.source) {
        debouncedResize(iframes[i], e.data.height);
        return;
      }
    }
  });

  function initializeIframes() {
    // Scoped selector — never touches iframe.iframe-polls or any other embed
    var iframes = document.querySelectorAll('iframe.iframe-interactive');
    iframes.forEach(function(iframe) {
      if (!iframe.style.height || iframe.style.height === 'auto') {
        iframe.style.height = '800px'; // sensible default until the first real postMessage arrives
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeIframes);
  } else {
    initializeIframes();
  }

  if (window.MutationObserver) {
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.addedNodes.length) {
          mutation.addedNodes.forEach(function(node) {
            if (node.tagName === 'IFRAME' && node.classList.contains('iframe-interactive')) {
              node.style.height = node.style.height || '800px';
            }
          });
        }
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  if (config.debug) console.log('Interactive resizer loaded (scoped to .iframe-interactive)');
})();
</script>

</body>
</html>
